name: CI - Backend Congreso

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ciisic_test
          MYSQL_USER: ciisic
          MYSQL_PASSWORD: ciisic_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_test"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ciisic:ciisic_test@127.0.0.1:3306/ciisic_test
      JWT_SECRET: ci-test-secret-at-least-32-characters

    steps:

      # 1. Clonar repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node (ajusta versión si usas otra)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Instalar dependencias
      - name: install dependencies
        run: npm ci

      # 4. Verificar lint
      - name: lint
        run: npm run lint

      # 5. Verificar build de TypeScript
      - name: build
        run: npm run build

      - name: apply test migrations
        run: npx prisma migrate deploy

      # 6. Ejecutar tests con Jest
      - name: tests
        run: npm run test
